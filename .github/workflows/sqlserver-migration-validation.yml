name: SQL Server Migration Validation

on:
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'EdificiosOlivaBackend/**'
      - '.github/workflows/sqlserver-migration-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration:
    name: Apply EF migrations on ephemeral SQL Server 2022
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Oliva_CI_Only_2026!'
        ports:
          - 1433:1433
    env:
      # This is a disposable CI database and password, never a production secret.
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1,1433;Database=EdificiosOliva_Migration_CI;User Id=sa;Password=Oliva_CI_Only_2026!;Encrypt=True;TrustServerCertificate=True;Connection Timeout=5'
      ASPNETCORE_ENVIRONMENT: Development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install matching EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.9

      - name: Restore and build
        run: |
          dotnet restore EdificiosOlivaBackend/EdificiosOliva.slnx
          dotnet build EdificiosOlivaBackend/EdificiosOliva.slnx --configuration Release --no-restore

      - name: Verify model matches the committed migration snapshot
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project EdificiosOlivaBackend/EdificiosOliva.Infrastructure \
            --startup-project EdificiosOlivaBackend/EdificiosOliva.Api \
            --context ApplicationDbContext --configuration Release --no-build

      - name: Apply all migrations to disposable SQL Server 2022
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if dotnet ef database update \
              --project EdificiosOlivaBackend/EdificiosOliva.Infrastructure \
              --startup-project EdificiosOlivaBackend/EdificiosOliva.Api \
              --context ApplicationDbContext --configuration Release --no-build; then
              echo "EF migrations applied to the disposable SQL Server database."
              exit 0
            fi
            echo "SQL Server is not ready or the migration failed (attempt ${attempt}/12)."
            sleep 5
          done
          echo "::error::Could not apply EF migrations to the disposable SQL Server database."
          exit 1

      - name: Verify migrations can be applied twice without changes
        run: |
          dotnet ef database update \
            --project EdificiosOlivaBackend/EdificiosOliva.Infrastructure \
            --startup-project EdificiosOlivaBackend/EdificiosOliva.Api \
            --context ApplicationDbContext --configuration Release --no-build

      - name: List applied migrations
        run: |
          dotnet ef migrations list \
            --project EdificiosOlivaBackend/EdificiosOliva.Infrastructure \
            --startup-project EdificiosOlivaBackend/EdificiosOliva.Api \
            --context ApplicationDbContext --configuration Release --no-build

      - name: Verify sequential and concurrent reservation idempotency
        run: |
          dotnet run \
            --project EdificiosOlivaBackend/EdificiosOliva.IntegrationChecks/EdificiosOliva.IntegrationChecks.csproj \
            --configuration Release
