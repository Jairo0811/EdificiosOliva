name: Docker Build Validation

on:
  push:
    branches:
      - master
      - main

  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  backend-image:
    name: Build backend container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ASP.NET Core image
        run: docker build --file EdificiosOlivaBackend/Dockerfile --tag edificios-oliva-api:ci .

  frontend-image:
    name: Build frontend container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Angular/Nginx image
        run: docker build --file EdificiosOlivaFrontend/Dockerfile --tag edificios-oliva-web:ci .
