name: Angular Modern Build

on:
  push:
    branches:
      - master
      - main

  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build, test and audit Angular application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Angular project
        id: frontend
        shell: bash
        run: |
          ANGULAR_FILE="$(find . -name angular.json -not -path '*/node_modules/*' -print -quit)"

          if [ -z "$ANGULAR_FILE" ]; then
            echo "No se encontró angular.json en el repositorio."
            echo "Contenido del repositorio:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          FRONTEND_DIR="$(dirname "$ANGULAR_FILE")"

          echo "Angular encontrado en: $FRONTEND_DIR"
          echo "dir=$FRONTEND_DIR" >> "$GITHUB_OUTPUT"

          test -f "$FRONTEND_DIR/package.json"
          test -f "$FRONTEND_DIR/package-lock.json"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ steps.frontend.outputs.dir }}/package-lock.json

      - name: Verify Angular project
        shell: bash
        working-directory: ${{ steps.frontend.outputs.dir }}
        run: |
          pwd
          ls -la
          test -f angular.json
          test -f package.json
          test -f package-lock.json

      - name: Install dependencies
        working-directory: ${{ steps.frontend.outputs.dir }}
        run: npm ci

      - name: Build Angular application
        working-directory: ${{ steps.frontend.outputs.dir }}
        run: npm run build

      - name: Run frontend tests
        id: frontend-tests
        shell: bash
        working-directory: ${{ steps.frontend.outputs.dir }}
        run: |
          set +e
          npm test -- --watch=false 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Audit production dependencies
        id: frontend-audit
        shell: bash
        working-directory: ${{ steps.frontend.outputs.dir }}
        run: |
          set +e
          npm audit --omit=dev --audit-level=high 2>&1 | tee audit-output.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-ci-output
          path: |
            ${{ steps.frontend.outputs.dir }}/test-output.txt
            ${{ steps.frontend.outputs.dir }}/audit-output.txt
          retention-days: 3

      - name: Enforce frontend tests
        if: steps.frontend-tests.outputs.exit_code != '0'
        run: exit 1

      - name: Enforce production dependency audit
        if: steps.frontend-audit.outputs.exit_code != '0'
        run: exit 1
