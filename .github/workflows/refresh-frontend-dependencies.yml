name: Refresh frontend dependencies

on:
  push:
    branches:
      - feature/payment-foundation-v1.1
    paths:
      - .github/workflows/refresh-frontend-dependencies.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/payment-foundation-v1.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: EdificiosOlivaFrontend/package-lock.json

      - name: Regenerate dependency tree and lockfile
        working-directory: EdificiosOlivaFrontend
        run: |
          rm -f package-lock.json
          npm install

      - name: Commit refreshed lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EdificiosOlivaFrontend/package.json EdificiosOlivaFrontend/package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency changes to commit.'
          else
            git commit -m 'security: refresh patched frontend dependencies'
            git push origin HEAD:feature/payment-foundation-v1.1
          fi

      - name: Verify production audit
        working-directory: EdificiosOlivaFrontend
        run: npm audit --omit=dev --audit-level=high
