name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore EdificiosOlivaBackend/EdificiosOliva.slnx
      - run: dotnet build EdificiosOlivaBackend/EdificiosOliva.slnx --configuration Release --no-restore
      - run: dotnet list EdificiosOlivaBackend/EdificiosOliva.slnx package --vulnerable --include-transitive

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EdificiosOlivaFrontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: EdificiosOlivaFrontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test -- --watch=false
