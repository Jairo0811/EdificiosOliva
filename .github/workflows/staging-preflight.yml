name: Staging Configuration Preflight

on:
  pull_request:
    branches: [master, main]
    paths:
      - '.env.staging.example'
      - '.gitignore'
      - 'scripts/validate-staging-config.mjs'
      - 'scripts/validate-staging-config.test.mjs'
      - 'scripts/assert-staging-compose.mjs'
      - 'scripts/assert-staging-compose.test.mjs'
      - 'scripts/smoke-staging.mjs'
      - 'scripts/smoke-staging.test.mjs'
      - 'ops/staging/**'
      - '.github/workflows/staging-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Validate staging safety defaults (offline, no deployment)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test fail-closed staging rules
        run: node --test scripts/validate-staging-config.test.mjs
      - name: Test Compose isolation rules
        run: node --test scripts/assert-staging-compose.test.mjs
      - name: Test allowlisted, GET-only smoke runner (offline)
        run: node --test scripts/smoke-staging.test.mjs
      - name: Validate staging configuration inventory
        run: node scripts/validate-staging-config.mjs --template
      - name: Verify Compose wiring without starting services
        shell: bash
        env:
          STAGING_HOST: staging.oliva-tests.example.org
          STAGING_ORIGIN: https://staging.oliva-tests.example.org
          STAGING_FIREBASE_PROJECT_ID: edificios-oliva-staging-qa
          STAGING_PUBLIC_PAYMENT_CAPABILITY_KEY: 'DAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAw='
          STAGING_SQL_CONNECTION_STRING: 'Server=staging-sql;Database=EdificiosOliva_Staging;User Id=staging_user;Password=SYNTHETIC_TEST_ONLY;Encrypt=True;TrustServerCertificate=False'
        run: |
          set -euo pipefail
          docker compose -f ops/staging/compose.yml config --format json | node scripts/assert-staging-compose.mjs
