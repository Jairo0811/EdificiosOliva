map $http_x_real_ip $eo_client_ip {
    default $http_x_real_ip;
    "" $remote_addr;
}

map $http_x_forwarded_proto $eo_forwarded_proto {
    "https" https;
    default $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # El proxy HTTPS de entrada DEBE sobrescribir X-Real-IP/X-Forwarded-Proto;
        # nginx está expuesto solo en loopback y la API confía solo en su IP fija.
        proxy_set_header X-Forwarded-For $eo_client_ip;
        proxy_set_header X-Forwarded-Proto $eo_forwarded_proto;
    }

    location = /health {
        proxy_pass http://api:8080/health;
    }

    location = /health/ready {
        proxy_pass http://api:8080/health/ready;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
